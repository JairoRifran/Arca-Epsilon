<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020507" />
    <!-- An internal console: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Arca Epsilon · Consola de Owner</title>
  </head>
  <body>
    <div id="admin-root" class="admin-root">
      <!-- Gate. Rendered first because the page must never flash data before
           the database has confirmed the account is an admin. -->
      <section class="gate" id="gate">
        <div class="gate__card">
          <p class="eyebrow">Arca Epsilon</p>
          <h1>Consola de Owner</h1>
          <p class="gate__message" id="gate-message">Verificando sesión…</p>

          <form class="gate__form" id="gate-form" hidden>
            <label>
              <span>Email</span>
              <input id="gate-email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Contraseña</span>
              <input id="gate-password" type="password" autocomplete="current-password" required />
            </label>
            <button type="submit" id="gate-submit">Ingresar</button>
          </form>

          <p class="gate__hint" id="gate-hint" hidden></p>
        </div>
      </section>

      <main class="console" id="console" hidden>
        <header class="console__bar">
          <div>
            <p class="eyebrow">Arca Epsilon</p>
            <h1>Consola de Owner</h1>
          </div>
          <div class="console__bar-actions">
            <span class="console__who" id="console-who"></span>
            <select id="range-select" aria-label="Rango de tiempo">
              <option value="7">7 días</option>
              <option value="30" selected>30 días</option>
              <option value="90">90 días</option>
            </select>
            <button type="button" id="refresh-button">Actualizar</button>
            <button type="button" id="signout-button" class="is-quiet">Salir</button>
          </div>
        </header>

        <p class="console__error" id="console-error" hidden></p>

        <section class="kpis" id="kpis" aria-label="Métricas generales"></section>

        <section class="panel">
          <div class="panel__head">
            <h2>Registros y actividad</h2>
            <p class="panel__note" id="chart-note"></p>
          </div>
          <div class="chart" id="chart"></div>
          <ul class="legend">
            <li><i class="swatch swatch--signups"></i>Registros</li>
            <li><i class="swatch swatch--active"></i>Jugadores activos</li>
            <li><i class="swatch swatch--sessions"></i>Sesiones</li>
          </ul>
        </section>

        <section class="panel">
          <div class="panel__head"><h2>Progresión de campaña</h2></div>
          <div id="progression" class="progression"></div>
        </section>

        <section class="panel">
          <div class="panel__head">
            <h2>Jugadores</h2>
            <input id="player-search" type="search" placeholder="Buscar por nombre o email" />
          </div>
          <div class="table-scroll">
            <table class="players">
              <thead>
                <tr>
                  <th>Jugador</th>
                  <th>Email</th>
                  <th>Alta</th>
                  <th>Última actividad</th>
                  <th class="is-num">Sesiones</th>
                  <th class="is-num">Minutos</th>
                  <th>Progreso</th>
                </tr>
              </thead>
              <tbody id="players-body"></tbody>
            </table>
          </div>
          <div class="pager">
            <button type="button" id="prev-page">Anterior</button>
            <span id="page-label"></span>
            <button type="button" id="next-page">Siguiente</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
